name: Database migration

# The migration test is instrumented, so it needs a booted emulator and costs an
# order of magnitude more time than the unit gate. Running it on every push would
# make the fast gate slow enough to start being skipped, so it runs when the
# schema, the migrations, or the repository that reads them actually change — and
# on demand, which is what a release should do before cutting a tag.
on:
  push:
    branches: [main]
    paths:
      - "app/src/main/java/**/data/db/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - ".github/workflows/migration.yml"
  pull_request:
    paths:
      - "app/src/main/java/**/data/db/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - ".github/workflows/migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      # The emulator needs hardware acceleration to boot in minutes rather than not
      # at all. The runner exposes /dev/kvm but not to the build user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The managed device downloads its system image on first use, and an unaccepted
      # licence for that image fails the setup task rather than the test — a failure
      # that reads like a broken migration and is not one.
      - name: Accept the system image licence
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Run the database migration test
        run: |
          chmod +x gradlew
          ./gradlew pixel2api30DebugAndroidTest \
            --console=plain \
            --no-daemon

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-test-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
